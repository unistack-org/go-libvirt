name: zdiag-secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          M: ${{ secrets.UNISTOCK_AI_REVIEW_MODEL }}
          U: ${{ secrets.UNISTOCK_AI_API_BASE_URL }}
          K: ${{ secrets.UNISTOCK_AI_API_KEY }}
          T: ${{ secrets.TOKEN }}
        run: |
          for n in M U K T; do
            v=$(printenv "$n")
            echo "$n len=${#v} nonempty=$([ -n "$v" ] && echo yes || echo no)"
          done
